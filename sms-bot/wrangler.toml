name = "nashville-sms-bot"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
SENDER_NAME = "Zack"
BOT_GOAL = "When an agent sends a listing or an address, look it up online, then text the agent to find out the property's condition and what the seller is asking. Once we know both, hand it to Zack to run numbers."
ARV_PERCENT = "70"
ASSIGNMENT_FEE = "10000"
PROPERTY_TYPES = "single-family houses in the Nashville area"
DRY_RUN = "true"

# Secrets (set with `npx wrangler secret put NAME`, never put them in this file):
# ANTHROPIC_API_KEY, GHL_TOKEN, GHL_LOCATION_ID, WEBHOOK_SECRET
