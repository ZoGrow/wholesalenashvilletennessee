name = "nashville-sms-bot"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Follow-up check-ins: hourly 10am-5pm Central on weekdays, up to 5 texts per run.
[triggers]
crons = ["30 15-22 * * *", "*/3 * * * *", "5 14-23 * * *"] # check-ins (daily, hourly 10-5 CT); every 3 min answer any missed agent text (8am-9pm CT); hourly offer follow-ups (9am-6pm CT)

[vars]
SENDER_NAME = "Zack"
SENDER_EMAIL = "zack@zogrowmedia.com" # company email, given when asked (Zack 2026-10-29); never for offers
BOT_GOAL = "When an agent sends a listing or an address, look it up online, find out what the seller is asking, why they are selling, timeline and condition. Hand Zack off-market leads asking under the Zestimate, or listed ones at a big discount, once the seller is vetted."
ARV_PERCENT = "70"
ASSIGNMENT_FEE = "10000"
QUALIFY_PERCENT = "100" # off-market: goes to Slack once the seller is under this % of Zestimate; above it the bot keeps negotiating on repairs (Zack 2026-10-25)
LISTED_QUALIFY_PERCENT = "60" # listed houses go to Slack only as a steal: motivated seller at or under this % of Zestimate (Zack 2026-10-27)
PROPERTY_TYPES = "any off-market property: houses, damaged or burned houses, teardowns, lots (no duplexes or other multifamily) (Zack 2026-10-26), in most US states (not Pennsylvania, South Carolina, Iowa, Kentucky, Nebraska, North Dakota, Oregon, Connecticut or Virginia)"
DRY_RUN = "false"
SLACK_ZACK_USER = "U059XGYL7P0" # Zack's Slack user: only his replies on lead cards send offers

# Secrets (set with `npx wrangler secret put NAME`, never put them in this file):
# ANTHROPIC_API_KEY, GHL_TOKEN, GHL_LOCATION_ID, WEBHOOK_SECRET
