name: Count today's texts

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Day to count (YYYY-MM-DD, Central). Blank = today"
        required: false

permissions:
  contents: write

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Count texts in GHL (read-only)
        env:
          GHL_TOKEN: ${{ secrets.GHL_TOKEN }}
          GHL_LOCATION_ID: ${{ secrets.GHL_LOCATION_ID }}
          DAY: ${{ inputs.date }}
        run: python scripts/texts_today.py "$DAY"
      - name: Save the result to the repo
        run: |
          git config user.name "lead-pipeline"
          git config user.email "lead-pipeline@users.noreply.github.com"
          git add stats/texts_today.json
          git commit -m "Texts today" || exit 0
          git pull --rebase origin main && git push origin HEAD:main
