name: Test a scraper

on:
  workflow_dispatch:
    inputs:
      actor:
        description: "Apify actor, e.g. braveleads/realtor-real-estate-agent-leads-scraper"
        required: true
      input:
        description: "Actor input as JSON"
        required: true

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the actor on a small sample
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          ACTOR: ${{ inputs.actor }}
          INPUT: ${{ inputs.input }}
        run: python scripts/test_actor.py "$ACTOR" "$INPUT"
      - name: Save the summary to the repo
        run: |
          git config user.name "lead-pipeline"
          git config user.email "lead-pipeline@users.noreply.github.com"
          git add stats/actor_test.json
          git commit -m "Scraper test: $ACTOR" || exit 0
          git pull --rebase origin main && git push origin HEAD:main
        env:
          ACTOR: ${{ inputs.actor }}
