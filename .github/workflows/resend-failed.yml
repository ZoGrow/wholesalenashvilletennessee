name: Resend failed texts

on:
  schedule:
    # Zack 2026-10-21: resend texts GHL blocked (opt-out/error limit) automatically.
    # Weekdays ~9:15am and ~3:30pm Central; stops if the limit error returns or after 8pm Central.
    - cron: "15 14 * * 1-5"
    - cron: "30 20 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "count (just look) or send"
        default: count
      limit:
        description: "Max texts to resend this run"
        default: "100"
      days:
        description: "Look back this many days for failed texts"
        default: "3"

permissions:
  contents: write


# One resend at a time: a second run waits and rescans, so nobody gets a text twice.
concurrency:
  group: resend-failed
  cancel-in-progress: false

jobs:
  resend:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - env:
          GHL_TOKEN: ${{ secrets.GHL_TOKEN }}
          GHL_LOCATION_ID: ${{ secrets.GHL_LOCATION_ID }}
          MODE: ${{ inputs.mode || 'send' }}
          LIMIT: ${{ inputs.limit || '1000' }}
          DAYS: ${{ inputs.days || '2' }}
        run: python scripts/resend_failed.py
      - if: always()
        run: |
          git config user.name "lead-pipeline"
          git config user.email "lead-pipeline@users.noreply.github.com"
          git add stats/resend_failed.json
          git commit -m "Resend failed texts" || exit 0
          git pull --rebase origin main && git push origin HEAD:main
