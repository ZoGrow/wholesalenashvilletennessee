name: Watch SMS bot logs

on:
  workflow_dispatch:          # read-only: records the bot's live logs for a few minutes (no texts sent)
    inputs:
      minutes:
        description: How long to watch
        default: "7"

permissions:
  contents: write

jobs:
  tail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: sms-bot
      - name: Tail logs
        working-directory: sms-bot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          export CLOUDFLARE_ACCOUNT_ID="$(echo "$ACCOUNT" | tr -d '[:space:]')"
          timeout $(( ${{ inputs.minutes }} * 60 )) npx wrangler tail --format json > tail.jsonl || true
      - name: Save a summary
        run: |
          mkdir -p stats
          python3 - <<'PY'
          import json
          out, text, dec, i = [], open("sms-bot/tail.jsonl").read(), json.JSONDecoder(), 0
          while (i := text.find("{", i)) != -1:  # wrangler prints one pretty-printed object per event
              try: e, i = dec.raw_decode(text, i)
              except Exception: i += 1; continue
              if not isinstance(e, dict): continue
              ev = e.get("event") if isinstance(e.get("event"), dict) else {}
              req = ev.get("request") if isinstance(ev.get("request"), dict) else {}
              msg = lambda l: " ".join(map(str, l.get("message", []))) if isinstance(l, dict) else str(l)
              out.append({"at": e.get("eventTimestamp"), "outcome": e.get("outcome"),
                          "trigger": ev.get("cron") or req.get("method"),
                          "logs": [msg(l)[:300] for l in e.get("logs", [])],
                          "errors": [str(x)[:300] for x in e.get("exceptions", [])]})
          json.dump(out, open("stats/bot_tail.json", "w"), indent=1)
          print(json.dumps(out, indent=1)[:20000])
          PY
          git config user.name "lead-pipeline"
          git config user.email "lead-pipeline@users.noreply.github.com"
          git add stats/bot_tail.json
          git commit -m "SMS bot log snapshot" || exit 0
          git pull --rebase origin main && git push origin HEAD:main
