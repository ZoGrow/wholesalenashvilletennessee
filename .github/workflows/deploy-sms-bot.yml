name: Deploy SMS reply bot

on:
  workflow_dispatch:          # run by hand from the Actions tab after changing sms-bot/

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: sms-bot
      - uses: cloudflare/wrangler-action@v3
        id: deploy
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: sms-bot
          secrets: |
            ANTHROPIC_API_KEY
            GHL_TOKEN
            GHL_LOCATION_ID
            WEBHOOK_SECRET
            SLACK_WEBHOOK_URL
            APIFY_TOKEN
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GHL_TOKEN: ${{ secrets.GHL_TOKEN }}
          GHL_LOCATION_ID: ${{ secrets.GHL_LOCATION_ID }}
          WEBHOOK_SECRET: ${{ secrets.SMS_BOT_WEBHOOK_SECRET }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }} # Zillow lookups (Zestimate + listing link)
      - name: Slack Offer Bot secrets (only once Zack has added them)
        working-directory: sms-bot
        run: |
          for k in SLACK_BOT_TOKEN SLACK_SIGNING_SECRET; do
            v="${!k}"
            if [ -n "$v" ]; then printf %s "$v" | npx wrangler secret put "$k"; else echo "$k not set yet"; fi
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}
      - name: Show the webhook URL
        run: |
          echo "### SMS bot is deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "Webhook URL for GHL: \`${URL}/?key=\` followed by your SMS_BOT_WEBHOOK_SECRET" >> "$GITHUB_STEP_SUMMARY"
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
      - name: Save the bot's address (without the key) to the repo
        run: |
          echo "$URL" > sms-bot/deployed_url.txt
          git config user.name "lead-pipeline"
          git config user.email "lead-pipeline@users.noreply.github.com"
          git add sms-bot/deployed_url.txt
          git commit -m "SMS bot deployed" || exit 0
          git pull --rebase origin main && git push origin HEAD:main
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
