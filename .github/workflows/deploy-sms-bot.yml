name: Deploy SMS reply bot

on:
  workflow_dispatch:          # run by hand from the Actions tab after changing sms-bot/

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: sms-bot
      - uses: cloudflare/wrangler-action@v3
        id: deploy
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: sms-bot
          secrets: |
            ANTHROPIC_API_KEY
            GHL_TOKEN
            GHL_LOCATION_ID
            WEBHOOK_SECRET
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GHL_TOKEN: ${{ secrets.GHL_TOKEN }}
          GHL_LOCATION_ID: ${{ secrets.GHL_LOCATION_ID }}
          WEBHOOK_SECRET: ${{ secrets.SMS_BOT_WEBHOOK_SECRET }}
      - name: Connect Slack (if the SLACK_WEBHOOK_URL secret is set)
        working-directory: sms-bot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          [ -n "$SLACK_WEBHOOK_URL" ] || { echo "No SLACK_WEBHOOK_URL secret; skipping Slack"; exit 0; }
          printf '%s' "$SLACK_WEBHOOK_URL" | npx wrangler secret put SLACK_WEBHOOK_URL
      - name: Show the webhook URL
        run: |
          echo "### SMS bot is deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "Webhook URL for GHL: \`${URL}/?key=\` followed by your SMS_BOT_WEBHOOK_SECRET" >> "$GITHUB_STEP_SUMMARY"
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
      - name: Save the bot's address (without the key) to the repo
        run: |
          echo "$URL" > sms-bot/deployed_url.txt
          git config user.name "lead-pipeline"
          git config user.email "lead-pipeline@users.noreply.github.com"
          git add sms-bot/deployed_url.txt
          git commit -m "SMS bot deployed" || exit 0
          git pull --rebase origin main && git push origin HEAD:main
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
