name: Mark unanswered texts unread

on:
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back (default 5)"
        required: false

permissions:
  contents: write

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Mark unread in GHL
        env:
          GHL_TOKEN: ${{ secrets.GHL_TOKEN }}
          GHL_LOCATION_ID: ${{ secrets.GHL_LOCATION_ID }}
          DAYS: ${{ inputs.days }}
        run: python scripts/restore_unread.py "$DAYS"
      - name: Save the result to the repo
        run: |
          git config user.name "lead-pipeline"
          git config user.email "lead-pipeline@users.noreply.github.com"
          git add stats/restore_unread.json
          git commit -m "Restore unread" || exit 0
          git pull --rebase origin main && git push origin HEAD:main
