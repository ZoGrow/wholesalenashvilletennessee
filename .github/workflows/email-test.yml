name: Test email replies into GHL

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "send or check"
        default: check

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GHL_TOKEN: ${{ secrets.GHL_TOKEN }}
          GHL_LOCATION_ID: ${{ secrets.GHL_LOCATION_ID }}
          MODE: ${{ inputs.mode }}
        run: python scripts/email_test.py
      - run: |
          git config user.name "lead-pipeline"
          git config user.email "lead-pipeline@users.noreply.github.com"
          git add stats/email_test.json
          git commit -m "Email test" || exit 0
          git pull --rebase origin main && git push origin HEAD:main
