name: Daily leads to GoHighLevel

on:
  schedule:
    # 10am Central, Monday-Friday, with backup slots every 30 minutes until noon.
    # GitHub only speaks UTC and sometimes skips or delays a scheduled run, so the
    # gate step below runs only from 10am Chicago time and only if today's run
    # hasn't already happened (checked in stats/history.csv).
    - cron: "0,30 15-17 * * 1-5"
  workflow_dispatch:        # lets you run it by hand from the Actions tab
    inputs:
      limit:
        description: "Test size: send exactly this many clean leads (blank = normal daily amount)"
        required: false
        default: ""

permissions:
  contents: write   # lets the run save stats/history.csv back to the repo

concurrency:
  group: daily-leads        # a backup slot waits for a running one, then sees it already ran
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Only run once a day, from 10am Central
        id: clock
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "go=yes" >> "$GITHUB_OUTPUT"; exit 0; fi
          hour=$(TZ=America/Chicago date +%-H)
          if [ "$hour" -lt 10 ] || [ "$hour" -ge 13 ]; then
            echo "Outside 10am-1pm Central; skipping."; echo "go=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if grep -q "^$(date -u +%F),[^,]*,no," stats/history.csv 2>/dev/null; then
            echo "Today's run already happened; skipping."; echo "go=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "go=yes" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.clock.outputs.go == 'yes'
        with:
          python-version: "3.12"
      - name: Pull leads and push to GoHighLevel
        if: steps.clock.outputs.go == 'yes'
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GHL_TOKEN: ${{ secrets.GHL_TOKEN }}
          GHL_LOCATION_ID: ${{ secrets.GHL_LOCATION_ID }}
          GHL_WORKFLOW_ID: ${{ secrets.GHL_WORKFLOW_ID }}
          LIMIT: ${{ inputs.limit }}
        run: python pipeline.py --send ${LIMIT:+--limit "$LIMIT"}
      - name: Save today's CSV
        if: always() && steps.clock.outputs.go == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: leads-csv
          path: output/*.csv
          retention-days: 30
          if-no-files-found: ignore
      - name: Save run stats to the repo
        if: always() && steps.clock.outputs.go == 'yes'
        run: |
          [ -f stats/history.csv ] || exit 0
          git config user.name "lead-pipeline"
          git config user.email "lead-pipeline@users.noreply.github.com"
          git add stats/history.csv
          git commit -m "Run stats $(date -u +%F)" || exit 0
          git pull --rebase origin main && git push origin HEAD:main
