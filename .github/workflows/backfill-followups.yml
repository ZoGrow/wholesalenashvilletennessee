name: Schedule follow-ups for warm agents

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "list (count only) or apply (add follow-up tags)"
        default: list
      per_day:
        description: "Max follow-ups scheduled per day"
        default: "40"

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - env:
          GHL_TOKEN: ${{ secrets.GHL_TOKEN }}
          GHL_LOCATION_ID: ${{ secrets.GHL_LOCATION_ID }}
          MODE: ${{ inputs.mode }}
          PER_DAY: ${{ inputs.per_day }}
        run: python scripts/backfill_followups.py
      - run: |
          git config user.name "lead-pipeline"
          git config user.email "lead-pipeline@users.noreply.github.com"
          git add stats/backfill_followups.json
          git commit -m "Follow-up backfill" || exit 0
          git pull --rebase origin main && git push origin HEAD:main
