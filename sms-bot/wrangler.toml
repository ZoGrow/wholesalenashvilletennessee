name = "nashville-sms-bot"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
SENDER_NAME = "Zack"
BOT_GOAL = "When an agent sends a listing or an address, look it up online, then find out the condition, whether it is off-market, and what the seller is asking. Hand Zack only qualified leads: distressed, off-market, seller asking roughly half of the Zestimate."
ARV_PERCENT = "70"
ASSIGNMENT_FEE = "10000"
QUALIFY_PERCENT = "75" # qualified lead: seller asks at or under this % of Zestimate (Zack: 75% max)
PROPERTY_TYPES = "single-family houses in most US states (not Pennsylvania, South Carolina, Iowa, Kentucky, Nebraska, North Dakota, Oregon, Connecticut or Virginia)"
DRY_RUN = "false"

# Secrets (set with `npx wrangler secret put NAME`, never put them in this file):
# ANTHROPIC_API_KEY, GHL_TOKEN, GHL_LOCATION_ID, WEBHOOK_SECRET
